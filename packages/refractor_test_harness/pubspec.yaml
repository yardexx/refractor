name: refractor_test_harness
description: >-
  Fixture-driven test harness that splits a Refractor build into measurable
  bands — correctness, resistance, and impact.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: 3.11.3

dependencies:
  kernel:
    path: ../third_party/kernel
  path: ^1.8.0
  prism:
    path: ../prism
  refractor:
    path: ../..
  yaml: ^3.1.0

dev_dependencies:
  test: ^1.24.0
  very_good_analysis: ^10.1.0
