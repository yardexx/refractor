name: Dart CI

on:
  push:
    branches:
      - main
      - release/*
      - dev/*
  pull_request:
    branches:
      - main
      - release/*
      - dev/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.6.5
        with:
          sdk: "3.11.3"

      - name: ⛓ Install Dependencies
        run: dart pub get

      - name: ✂ Format
        run: dart format --output=none --set-exit-if-changed .

      - name: 📊 Analyze
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: 🧪 Run Tests
        run: dart test --coverage=coverage

      # `dart test` at the root only runs the root package's tests; workspace
      # packages carry their own suites and must be run from their directories.
      - name: 🧪 Run Workspace Package Tests
        run: |
          for pkg in packages/kernel_model packages/prism packages/spectrometer; do
            echo "::group::$pkg"
            (cd "$pkg" && dart test) || exit 1
            echo "::endgroup::"
          done

      - name: 📈 Generate Coverage Report
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib

      - name: 📈 Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📊 Run Pana
        run: dart pub global activate pana && dart pub global run pana