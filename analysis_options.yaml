include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "test/fixtures/**"
    # The docs site is a separate jaspr package with its own deps and CI
    # (.github/workflows/docs.yml); don't analyze it as part of this package.
    - "docs/**"
  errors:
    # Too strict
    todo: false
    # Docs are planned for later
    public_member_api_docs: false
    # Too strict
    one_member_abstracts: false
